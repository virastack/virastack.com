<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ViraStack Password — intro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --fg: #0a0a0a;
        --muted: #737373;
        --border: #e5e5e5;
        --rose: #ff2056;
        --weak: #fb2c36;
        --fair: #fe9a00;
        --good: #7ccf00;
        --strong: #00a63e;
        --sans: "Inter", -apple-system, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        background: #fff;
      }

      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        font-family: var(--sans);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }

      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
      }

      .layer {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }

      /* ---------- step chip ---------- */
      #right {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #chip {
        display: flex;
      }

      #chip .pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 7px 16px 7px 12px;
        font-family: var(--mono);
        font-size: 14px;
        color: var(--muted);
        background: #fff;
      }

      #chip b {
        color: var(--rose);
        font-weight: 600;
      }

      /* ---------- split scene ---------- */
      #scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 36px;
        padding-top: 48px;
      }

      .card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow:
          0 1px 2px rgba(10, 10, 10, 0.04),
          0 24px 60px -28px rgba(10, 10, 10, 0.25);
      }

      #codeCard {
        width: 760px;
        overflow: hidden;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--border);
        background: #fafafa;
      }

      .bar i {
        width: 11px;
        height: 11px;
        border-radius: 999px;
        background: #e3e3e3;
      }

      .bar span {
        flex: 1;
        text-align: center;
        font-family: var(--mono);
        font-size: 13px;
        color: #9a9a9a;
        margin-left: -33px;
      }

      #code {
        /* Sized for the finished file, so the card never resizes. */
        height: 588px;
        padding: 24px 28px;
        font-family: var(--mono);
        font-size: 16px;
      }

      .line {
        height: 0;
        overflow: hidden;
        border-radius: 5px;
        margin: 0 -8px;
        padding: 0 8px;
        white-space: pre;
        line-height: 27px;
      }

      .c-kw {
        color: #cf222e;
      }
      .c-str {
        color: #0a3069;
      }
      .c-fn {
        color: #8250df;
      }
      .c-tag {
        color: #116329;
      }
      .c-num {
        color: #0550ae;
      }
      .c-com {
        color: #8c959f;
      }
      .c-punct,
      .c-plain,
      .c-ws {
        color: #1f2328;
      }

      /* ---------- output panel ---------- */
      #uiCard {
        width: 380px;
        /* Lines the field up with the first line of code. */
        margin-top: 40px;
        padding: 26px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .slot {
        overflow: hidden;
      }

      .field {
        position: relative;
      }

      .input {
        height: 48px;
        border: 1px solid var(--border);
        border-radius: 11px;
        display: flex;
        align-items: center;
        padding: 0 50px 0 14px;
        background: #fff;
      }

      .input .ph {
        color: #a3a3a3;
        font-size: 15px;
      }

      .input .val {
        font-family: var(--mono);
        font-size: 15px;
      }

      .input .dots {
        font-size: 20px;
        letter-spacing: 3px;
        line-height: 1;
      }

      .input .cur {
        display: inline-block;
        width: 1.5px;
        height: 19px;
        background: var(--fg);
        margin-left: 2px;
        vertical-align: -4px;
      }

      .eye {
        position: absolute;
        top: 50%;
        right: 7px;
        transform: translateY(-50%);
        width: 34px;
        height: 34px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        color: var(--muted);
      }

      .eye svg {
        width: 18px;
        height: 18px;
      }

      .ripple {
        position: absolute;
        top: 50%;
        right: 7px;
        width: 34px;
        height: 34px;
        transform: translateY(-50%);
        border-radius: 999px;
        border: 2px solid var(--rose);
        opacity: 0;
      }

      #strengthBlock {
        height: 42px;
        display: grid;
        gap: 11px;
        align-content: start;
      }

      .bars {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .bars span {
        height: 7px;
        border-radius: 999px;
        background: #ededed;
        position: relative;
        overflow: hidden;
      }

      .bars span::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--lvl, transparent);
        transform: scaleX(var(--p, 0));
        transform-origin: left;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
        color: var(--muted);
      }

      .meta .level {
        font-weight: 600;
        text-transform: capitalize;
      }

      .btn {
        height: 44px;
        border-radius: 11px;
        background: #171717;
        color: #fff;
        font-size: 15px;
        font-weight: 500;
        display: grid;
        place-items: center;
      }

      .spinner {
        width: 17px;
        height: 17px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
      }

      .result {
        height: 84px;
        border: 1px solid #ffd5de;
        background: #fff5f7;
        border-radius: 12px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .result svg {
        width: 25px;
        height: 25px;
        color: var(--rose);
        flex: none;
      }

      .result .count {
        font-family: var(--mono);
        font-size: 25px;
        font-weight: 600;
        color: var(--rose);
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }

      .result .cap {
        font-size: 13px;
        color: #9f6673;
      }

      /* ---------- intro / outro ---------- */
      .lockup {
        display: flex;
        align-items: center;
        gap: 6px;
        /* The mark's transparent padding would otherwise push the lockup right. */
        margin-left: -28px;
      }

      /* The mark carries transparent padding, so the box is wider than the blob. */
      .lockup img {
        width: 207px;
        height: 207px;
      }

      .lockup .name {
        font-size: 92px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .lockup .product {
        font-size: 92px;
        font-weight: 600;
        font-style: italic;
        letter-spacing: -0.03em;
        color: var(--rose);
        margin-left: 24px;
      }

      .endWrap {
        display: grid;
        justify-items: center;
        gap: 28px;
      }

      .cmd {
        background: #171717;
        color: #fff;
        border-radius: 10px;
        padding: 14px 22px;
        font-family: var(--mono);
        font-size: 22px;
      }

      .cmd b {
        color: var(--rose);
        font-weight: 500;
        margin-right: 10px;
      }

      .url {
        font-family: var(--mono);
        font-size: 16px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="scene">
        <div class="card" id="codeCard">
          <div class="bar"><i></i><i></i><i></i><span>password-field.tsx</span></div>
          <div id="code"></div>
        </div>

        <div id="right">
          <div id="chip">
            <span class="pill"><b id="chipNum">01</b><span id="chipText">show / hide</span></span>
          </div>

          <div class="card" id="uiCard">
            <div class="field">
              <div class="input"><span id="val"></span></div>
              <div class="eye" id="eye"></div>
              <div class="ripple" id="ripple"></div>
            </div>

            <div class="slot" id="strengthSlot">
              <div id="strengthBlock">
                <div class="bars" id="bars">
                  <span></span><span></span><span></span><span></span>
                </div>
                <div class="meta">
                  <span class="level" id="level"></span><span id="hint"></span>
                </div>
              </div>
            </div>

            <div class="slot" id="btnSlot">
              <div class="btn" id="btn"><span>Check</span></div>
            </div>

            <div class="slot" id="resultSlot">
              <div class="result">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
                  />
                  <path d="M12 8v4" />
                  <path d="M12 16h.01" />
                </svg>
                <div>
                  <div class="count" id="count">0</div>
                  <div class="cap">times leaked</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="layer" id="introLayer">
        <div class="lockup">
          <img src="/public/logo-icon.svg" alt="" />
          <div><span class="name">ViraStack</span><span class="product">Password</span></div>
        </div>
      </div>

      <div class="layer" id="outroLayer">
        <div class="endWrap">
          <div class="lockup">
            <img src="/public/logo-icon.svg" alt="" />
            <div><span class="name">ViraStack</span><span class="product">Password</span></div>
          </div>
          <div class="cmd" id="outCmd"><b>$</b>npm install @virastack/password</div>
          <div class="url" id="outUrl">virastack.com/password</div>
        </div>
      </div>
    </div>

    <script type="module">
      /* ------------------------------------------------------------------
       * One file, one panel: the snippet grows act by act while the output
       * panel on the right reacts. Every value is a pure function of t, so
       * the renderer can step frame by frame and get the same picture.
       *
       * The strength shown is the real thing: the published engine is loaded
       * from node_modules and asked about every prefix the demo types.
       * ------------------------------------------------------------------ */
      import { definePolicy } from "/node_modules/@virastack/password/dist/strength.mjs";

      const policy = definePolicy({ preset: "nist" });
      const EYE =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
      const EYE_OFF =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';

      const $ = (id) => document.getElementById(id);
      const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
      const ramp = (t, start, dur) => clamp01((t - start) / dur);
      const easeOut = (x) => 1 - Math.pow(1 - x, 3);

      function show(el, t, inAt, out, rise = 16, dur = 0.5) {
        const i = easeOut(ramp(t, inAt, dur));
        const o = out == null ? 0 : easeOut(ramp(t, out, 0.38));
        const v = i * (1 - o);
        el.style.opacity = v;
        el.style.transform = "translateY(" + ((1 - i) * rise - o * 12) + "px)";
        el.style.visibility = v <= 0.002 ? "hidden" : "visible";
        return v;
      }

      /** Opens or closes a block without disturbing the grid gap. */
      function slot(el, height, p) {
        el.style.height = height * p + "px";
        el.style.marginTop = (p - 1) * 16 + "px";
        el.style.opacity = p;
      }

      /* ---------------- syntax highlighting ---------------- */
      const RULES = [
        [/^\/\/[^\n]*/, "c-com"],
        [/^"(?:[^"\\]|\\.)*"/, "c-str"],
        [/^\b(?:import|from|export|function|const|let|return|await|async)\b/, "c-kw"],
        [/^\b\d[\d_]*\b/, "c-num"],
        [/^<\/?[A-Za-z][\w.]*/, "c-tag"],
        [/^\/>/, "c-tag"],
        [/^[A-Za-z_$][\w$]*(?=\()/, "c-fn"],
        [/^[A-Za-z_$][\w$]*/, "c-plain"],
        [/^\s+/, "c-ws"],
        [/^[^]/, "c-punct"],
      ];

      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      function highlight(src) {
        let rest = src;
        let html = "";
        while (rest.length) {
          for (const [re, cls] of RULES) {
            const m = re.exec(rest);
            if (m) {
              html += '<span class="' + cls + '">' + esc(m[0]) + "</span>";
              rest = rest.slice(m[0].length);
              break;
            }
          }
        }
        return html || "&nbsp;";
      }

      /* ---------------- timeline ---------------- */
      const INTRO = { in: 0.25, out: 2.3, end: 2.75 };
      const SCENE = 2.8;

      const A1 = { demo: 4.3, reveal: 6.5, hide: 8.2, end: 8.8 };
      const A2 = { code: 9.0, demo: 11.0, end: 15.5 };
      const A3 = { code: 15.9, demo: 17.6, end: 23.4 };
      const OUTRO = { in: 24.6, cmd: 25.05, url: 25.35 };
      const TOTAL = 27.9;
      window.__total = TOTAL;
      /** The frame the renderer saves as the poster. */
      window.__poster = A3.end - 1.2;

      /* Each code line knows when it slides in, and the replaced hook line
         knows when it slides out. */
      const SRC = [
        ['import { useState } from "react"', A3.code],
        ['import { useViraPassword } from "@virastack/password"', 0],
        ['import { definePolicy } from "@virastack/password/strength"', A2.code],
        ['import { checkPwned } from "@virastack/password/pwned"', A3.code + 0.35],
        ["", 0],
        ['const policy = definePolicy({ preset: "nist" })', A2.code + 0.35],
        ["", A2.code + 0.35],
        ["export function PasswordField() {", 0],
        ["  const { inputProps, btnProps } = useViraPassword()", 0, A2.code + 0.8],
        ["  const { inputProps, btnProps, strength } = useViraPassword({ policy })", A2.code + 0.8],
        ["  const [leak, setLeak] = useState(null)", A3.code + 0.7],
        ["", 0],
        ["  return (", 0],
        ["    <div>", 0],
        ["      <input {...inputProps} />", 0],
        ["      <button {...btnProps} />", 0],
        ["      <StrengthBars level={strength.level} />", A2.code + 1.2],
        ["      <LeakButton onCheck={(pw) => checkPwned(pw).then(setLeak)} />", A3.code + 1.05],
        ["    </div>", 0],
        ["  )", 0],
        ["}", 0],
      ];

      const LINE_H = 27;
      const lines = SRC.map(([text, born, die], i) => {
        const el = document.createElement("div");
        el.className = "line";
        el.innerHTML = highlight(text);
        $("code").append(el);
        // The opening block fades in line by line; later lines arrive with a flash.
        return {
          el,
          born: born === 0 ? SCENE + 0.2 + i * 0.045 : born,
          die: die ?? null,
          fresh: born !== 0 && text.trim() !== "",
        };
      });

      /* ---------------- demo content ---------------- */
      const PW1 = "V!ra-2026";
      const PW2 = "Blue#Coffee-42!cat";
      const PW3 = "password123";
      const COUNT = 2266543;
      const FILLED = { weak: 1, fair: 2, good: 3, strong: 4 };
      const COLORS = {
        weak: "var(--weak)",
        fair: "var(--fair)",
        good: "var(--good)",
        strong: "var(--strong)",
      };
      /** Straight from the package, for whatever the field holds right now. */
      const levelOf = (value) => (value.length === 0 ? null : policy.evaluate(value).level);

      const T1 = 0.16; // act 1 keystroke
      const T2 = 0.15;
      const T3 = 0.145;
      const CLR = 0.05; // backspace
      const A2_TYPE = A2.demo + PW1.length * CLR + 0.25;
      const A3_TYPE = A3.demo + PW2.length * 0.035 + 0.3;
      const CLICK = A3_TYPE + PW3.length * T3 + 0.7;
      const SPIN_END = CLICK + 1.0;

      /** The one password field, across all three acts. */
      function fieldValue(t) {
        if (t < A2.demo)
          return PW1.slice(0, Math.max(0, Math.min(PW1.length, Math.floor((t - A1.demo) / T1))));
        if (t < A2_TYPE)
          return PW1.slice(0, Math.max(0, PW1.length - Math.floor((t - A2.demo) / CLR)));
        if (t < A3.demo) return PW2.slice(0, Math.min(PW2.length, Math.floor((t - A2_TYPE) / T2)));
        if (t < A3_TYPE)
          return PW2.slice(0, Math.max(0, PW2.length - Math.floor((t - A3.demo) / 0.035)));
        return PW3.slice(0, Math.min(PW3.length, Math.floor((t - A3_TYPE) / T3)));
      }

      /** When each bar first fills, so it can grow instead of snapping. */
      function barStart(k) {
        for (let n = 1; n <= PW2.length; n++) {
          if (FILLED[levelOf(PW2.slice(0, n))] >= k) return A2_TYPE + n * T2;
        }
        return Infinity;
      }
      const BAR_AT = [0, barStart(1), barStart(2), barStart(3), barStart(4)];

      /* ---------------- per-frame painting ---------------- */
      function paintCode(t) {
        for (const line of lines) {
          const p = easeOut(ramp(t, line.born, 0.42));
          const q = line.die == null ? 0 : easeOut(ramp(t, line.die, 0.32));
          const v = p * (1 - q);
          line.el.style.height = LINE_H * v + "px";
          line.el.style.opacity = v;
          const flash = line.fresh ? clamp01(1 - ramp(t, line.born + 0.9, 0.8)) * p * (1 - q) : 0;
          line.el.style.background =
            flash > 0.004 ? "rgba(255, 32, 86, " + 0.11 * flash + ")" : "transparent";
        }
      }

      function paintChip(t) {
        const step = t < A2.code ? 0 : t < A3.code ? 1 : 2;
        const labels = [
          ["01", "show / hide"],
          ["02", "strength"],
          ["03", "leak check"],
        ];
        $("chipNum").textContent = labels[step][0];
        $("chipText").textContent = labels[step][1];
        show($("chip"), t, SCENE + 0.1, OUTRO.in - 0.5, 10, 0.45);
      }

      function paintField(t) {
        const value = fieldValue(t);
        const visible = (t >= A1.reveal && t < A1.hide) || t >= A2.demo;
        const typing = t > A1.demo && t < A3.end - 0.6;
        const caret = typing ? '<span class="cur"></span>' : "";
        $("val").innerHTML =
          value.length === 0
            ? typing
              ? caret
              : '<span class="ph">Password</span>'
            : (visible
                ? '<span class="val">' + value + "</span>"
                : '<span class="dots">' + "•".repeat(value.length) + "</span>") + caret;
        $("eye").innerHTML = visible ? EYE_OFF : EYE;
        $("eye").style.color = visible ? "var(--fg)" : "var(--muted)";

        let press = 0;
        for (const at of [A1.reveal, A1.hide]) {
          const p = ramp(t, at - 0.04, 0.5);
          if (p > 0 && p < 1) press = Math.max(press, p);
        }
        $("ripple").style.opacity = press > 0 ? (1 - press) * 0.55 : 0;
        $("ripple").style.transform = "translateY(-50%) scale(" + (1 + press * 0.7) + ")";
      }

      function paintStrength(t) {
        const born = A2.code + 1.2;
        const p = easeOut(ramp(t, born, 0.45));
        slot($("strengthSlot"), 42, p);
        if (p <= 0.002) return;

        const value = fieldValue(t);
        const len = value.length;
        const level = levelOf(value);
        const filled = level ? FILLED[level] : 0;
        const bars = $("bars").children;
        for (let k = 1; k <= 4; k++) {
          const on = k <= filled ? easeOut(ramp(t, BAR_AT[k], 0.2)) : 0;
          bars[k - 1].style.setProperty("--p", on);
          bars[k - 1].style.setProperty("--lvl", level ? COLORS[level] : "transparent");
        }
        $("level").textContent = level || "";
        $("level").style.color = level ? COLORS[level] : "transparent";
        $("hint").textContent = len === 0 ? "15 characters or more" : len + " characters";
      }

      function paintLeak(t) {
        const born = A3.code + 0.8;
        const p = easeOut(ramp(t, born, 0.45));
        slot($("btnSlot"), 44, p);

        const btn = $("btn");
        if (t >= CLICK && t < SPIN_END) {
          btn.innerHTML =
            '<div class="spinner" style="transform:rotate(' + (t - CLICK) * 540 + 'deg)"></div>';
        } else {
          btn.innerHTML = "<span>Check</span>";
        }
        const press = ramp(t, CLICK, 0.12) * (1 - ramp(t, CLICK + 0.12, 0.14));
        btn.style.transform = "scale(" + (1 - press * 0.02) + ")";

        const appear = easeOut(ramp(t, SPIN_END, 0.4));
        slot($("resultSlot"), 84, appear);
        const grow = easeOut(ramp(t, SPIN_END + 0.05, 0.9));
        $("count").textContent = Math.round(COUNT * grow).toLocaleString("en-US");
      }

      function seek(t) {
        show($("introLayer"), t, INTRO.in, INTRO.out, 14, 0.7);
        show($("scene"), t, SCENE, OUTRO.in - 0.5, 18, 0.55);
        paintChip(t);
        paintCode(t);
        paintField(t);
        paintStrength(t);
        paintLeak(t);
        const outro = show($("outroLayer"), t, OUTRO.in, null, 14, 0.7);
        if (outro > 0.002) {
          show($("outCmd"), t, OUTRO.cmd, null, 10, 0.5);
          show($("outUrl"), t, OUTRO.url, null, 8, 0.5);
        }
      }

      window.__seek = (ms) => seek(ms / 1000);
      seek(0);

      if (!location.search.includes("render")) {
        const t0 = performance.now();
        const loop = () => {
          seek(((performance.now() - t0) / 1000) % TOTAL);
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
    </script>
  </body>
</html>
